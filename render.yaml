# Render Blueprint: deploys pdftek from the Dockerfile, which bundles LibreOffice so Word, Excel and
# PowerPoint files convert to PDF. In Render: New > Blueprint, pick this repository, then fill in the
# secret values when prompted.
services:
  - type: web
    name: pdftek
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # a persistent disk requires a paid instance type
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: DATA_DIR
        value: /data
      - key: APP_URL
        sync: false # e.g. https://pdftek.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: pdftek-data
      mountPath: /data
      sizeGB: 5
